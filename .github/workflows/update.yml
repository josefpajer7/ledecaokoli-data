name: Aktualizace dat

on:
  schedule:
    # každý den ve 4:00 UTC = 6:00 v létě, 5:00 v zimě (pražského času)
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Uložit surová data ze zdrojů do složky debug/ (pro ladění)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stáhnout data ze zdrojů
        id: fetch
        continue-on-error: true
        env:
          DEBUG: ${{ inputs.debug && '1' || '0' }}
        run: node scripts/update.mjs

      - name: Uložit změny
        run: |
          git config user.name "ledecaokoli-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ debug/ 2>/dev/null || git add data/
          if git diff --cached --quiet; then
            echo "Žádná změna."
          else
            git commit -m "Aktualizace dat $(TZ=Europe/Prague date '+%-d. %-m. %Y %H:%M')"
            git pull --rebase origin main
            git push
          fi

      - name: Nahlásit chybu zdroje
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Některý zdroj se nepodařilo stáhnout — podrobnosti v kroku 'Stáhnout data ze zdrojů' a v data/meta.json. Web dál ukazuje data z posledního úspěšného běhu."
          exit 1
